version: "2"

sql:
  - engine: postgresql
    schema: db/wallet/migrations
    queries: db/wallet/queries
    gen:
      go:
        package: walletdb
        out: internal/wallet/walletdb
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_enum_valid_method: true
        emit_json_tags: true
        overrides:
          # NOT NULL uuid -> uuid.UUID
          - db_type: uuid
            go_type: "uuid.UUID"

          # nullable uuid -> *uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: "uuid"
              type: "UUID"
              pointer: true

          # NOT NULL timestamptz -> time.Time
          - db_type: timestamptz
            go_type: time.Time
